- hook: How does a plant remember something without a brain?
  fact: A Venus flytrap only closes after two touches. So it has to remember the first one. In 2020, scientists in Japan made flytraps that glow when calcium builds up inside their cells. The first touch
    raises the calcium, but not enough. If a second touch comes before it fades, the calcium crosses a limit. And the trap snaps shut. So its memory is just a chemical signal that fades after a few seconds.
    No brain required.
