id: glass-frog-hides-its-blood
language: en
documentary:
  topic: The glass frog that hides its blood to become invisible
  working_title: The frog that turns invisible when it sleeps
  category: animal
  subcategory: anfibios
  hook_type: misterio
  species: [Hyalinobatrachium fleischmanni]
  scenes:
    - narration: >-
        This frog has a superpower straight out of a comic book: when it falls asleep, it becomes almost invisible.
        And to pull it off, it does something that, in any other animal, would be a medical emergency.
        It pulls nearly all of its red blood out of circulation… and hides it. For hours.
        And, as far as we can tell, without forming a single blood clot.
      visual_query: Hyalinobatrachium fleischmanni
      on_screen_text: Invisible while it sleeps
      key_fact: false
    - narration: >-
        Meet the glass frogs, a family of amphibians called Centrolenidae, with more than one hundred and fifty species
        living in the humid forests of Central and South America. Today we're focusing on one in particular:
        Hyalinobatrachium fleischmanni, Fleischmann's glass frog.
      visual_query: Centrolenidae
      on_screen_text: Glass frogs
      key_fact: false
    - narration: >-
        Fleischmann's glass frog lives from southern Mexico down into northern South America, in rainforests and cloud forests,
        always close to running water. It spends most of its life on the leaves of trees and shrubs that hang over streams.
        If you ever want to find one, go out at night with a headlamp during the rainy season… and listen.
        You'll usually hear it long before you see it. And even then, seeing it is the hard part.
      visual_query: tropical stream rainforest
      on_screen_text: Life above the stream
      key_fact: false
    - narration: >-
        From above, it looks like an ordinary lime-green frog, barely two or three centimeters long, about an inch.
        But flip it over and you'll see its secret: the skin on its belly is see-through.
        You can watch its heart beating. You can see its liver, its gut… and, in females, even the eggs.
      visual_query: Hyalinobatrachium
      on_screen_text: A see-through belly
      key_fact: true
    - narration: >-
        So what's the point of being transparent? During the day, these frogs sleep stuck to the underside of leaves.
        A study published in 2020 showed that their translucency does something clever: the edges of their body
        take on the color of the leaf beneath them, so their outline blurs away.
        And for a bird hunting for frogs, the outline is exactly what gives prey away.
      visual_query: Teratohyla spinosa
      on_screen_text: An outline that fades away
      key_fact: true
    - narration: >-
        But there was a problem. Blood is red, and it absorbs a lot of light. A circulatory system full of red blood cells
        would draw a network of lines and blotches right through the animal. For years, nobody knew how glass frogs
        got around this. Until 2022. And the answer turned out to be astonishing.
      visual_query: red blood cells scanning electron micrograph
      on_screen_text: The blood problem
      key_fact: false
    - narration: >-
        A team led by Carlos Taboada and Jesse Delia, with researchers from Duke University and the American Museum of Natural History,
        published in the journal Science that, when the frog sleeps, it removes about eighty-nine percent of its red blood cells
        from circulation and packs them into its liver. And as it does, the frog becomes far more transparent.
      visual_query: Hyalinobatrachium fleischmanni
      on_screen_text: 89% of its blood, hidden
      key_fact: true
    - narration: >-
        How do you see the blood inside a sleeping frog without waking it up? They used a technique called photoacoustic imaging.
        You shine a gentle laser on the animal. The red blood cells absorb that light, warm up by a tiny fraction of a degree,
        and give off ultrasound. By listening to those sounds, you can map where the blood is, without ever touching the frog.
      visual_query: Cochranella
      on_screen_text: Listening to blood
      key_fact: true
    - narration: >-
        That gentle approach was essential. Studying a frog usually means handling it, and a stressed or anesthetized frog
        doesn't do the trick: the blood flows back into circulation. That's why this went unnoticed for so long.
        The frogs had to be observed the way they are in nature: truly asleep, upside down, stuck to a surface,
        with nobody touching them.
      visual_query: Hyalinobatrachium fleischmanni
      on_screen_text: A well-kept secret
      key_fact: false
    - narration: >-
        And why the liver? It's a huge organ, packed with blood vessels and used to filtering blood.
        Other animals do something similar with a different organ: the spleen. Horses, dogs and seals store reserves
        of red blood cells there, and release them when they need extra oxygen, like when running or diving.
        The glass frog flips that idea around: not to perform better, but to hide.
      visual_query: Leptonychotes weddellii
      on_screen_text: A blood storage unit
      key_fact: true
    - narration: >-
        On top of that, in many glass frogs some organs are wrapped in a white, reflective layer made of guanine crystals,
        which helps conceal them. It's a trick shared with lots of other animals, like many fish,
        that use reflective tissue to bounce light around and confuse whoever is looking.
      visual_query: Hyalinobatrachium valerioi
      on_screen_text: Guanine mirrors
      key_fact: false
    - narration: >-
        When the frog wakes up and starts moving, the blood flows back and it becomes less transparent.
        That makes sense: to jump, hunt or call, it needs oxygen, and oxygen is carried precisely by red blood cells.
        It's a trade-off: invisibility while resting, performance while active.
      visual_query: Hyalinobatrachium fleischmanni
      on_screen_text: Invisible or active
      key_fact: false
    - narration: >-
        And here's what caught the attention of doctors. In a person, packing blood like that into one organ
        would be a recipe for clots, and clots can cause thrombosis or heart attacks.
        This frog does it every single day, for hours, and stays perfectly healthy.
        Understanding how it manages that could one day inspire new anticoagulant drugs.
      visual_query: fibrin blood clot electron micrograph
      on_screen_text: No clots
      key_fact: true
    - narration: >-
        Think about how strange that is. Our bodies treat blood that stops moving as a warning sign: when blood pools,
        it tends to clot. That's why doctors tell people on long flights to get up and walk around.
        The glass frog seems to have found a way to switch that alarm off every day while it sleeps, and back on at dusk when it wakes up.
        Nobody knows yet exactly how. And that's what makes it so exciting.
      visual_query: Hyalinobatrachium
      on_screen_text: An alarm switched off
      key_fact: false
    - narration: >-
        When night falls, the glass frogs come alive. Males call from leaves hanging over streams,
        with high-pitched calls that sound more like an insect than a frog.
        And right there, on the underside of a leaf, the female will lay her eggs.
      visual_query: Centrolenidae
      on_screen_text: Concerts over the stream
      key_fact: false
    - narration: >-
        Its menu is typical for a small frog: tiny flies, mosquitoes, small spiders and other invertebrates
        that it catches at night among the leaves. It's a sit-and-wait hunter: it stays still and grabs whatever wanders close.
        A strategy that fits perfectly with its camouflage: the less it's seen, the easier it is to surprise its prey.
      visual_query: Hyalinobatrachium
      on_screen_text: Sit-and-wait hunter
      key_fact: false
    - narration: >-
        And here's another surprise: in this species, it's the father who looks after the eggs.
        Males guard the clutches for days, protect them from insects that feed on them,
        and even keep them hydrated with their own bodies. A two-centimeter bodyguard.
      visual_query: Hyalinobatrachium valerioi
      on_screen_text: Bodyguard dad
      key_fact: true
    - narration: >-
        That's rarer than it sounds. In most animals, when there's care for the young, it's usually the mother's job.
        But by studying many glass frog species, researchers found that care by fathers has appeared several times,
        independently, over the course of their evolution. A hint that, in these streams, having dad near the eggs
        makes the difference between surviving or not.
      visual_query: Hyalinobatrachium colymbiphyllum
      on_screen_text: Fathers by evolution
      key_fact: false
    - narration: >-
        When the tadpoles are ready, they break out of the jelly and drop from the leaf into the stream below.
        There they'll live hidden among leaf litter and mud on the bottom until they complete their metamorphosis.
      visual_query: tropical stream rainforest
      on_screen_text: The leap into the stream
      key_fact: false
    - narration: >-
        Transparency is extremely rare in land animals. In the ocean it's much more common: jellyfish, fish larvae,
        tiny crustaceans. In water it's easier to be see-through, because body tissues are similar to the water around them.
        On land, with air and direct sunlight, it's far, far harder. That's what makes glass frogs so special.
      visual_query: Aurelia aurita
      on_screen_text: See-through on land
      key_fact: false
    - narration: >-
        Mind you, they're not completely invisible. The green back is translucent, not transparent, and some organs still show.
        In fact, no land vertebrate is known to be fully transparent.
        But for a predator that hunts by sight, it's enough for the outline to melt into the leaf.
      visual_query: Teratohyla spinosa
      on_screen_text: Almost invisible
      key_fact: false
    - narration: >-
        And there are still glass frogs waiting to be discovered. New species are described every few years.
        In 2015, for example, researchers in Costa Rica presented Hyalinobatrachium dianae: a green frog with big, dark eyes
        whose resemblance to Kermit the Frog made headlines around the world.
        If animals this striking went unnoticed, imagine how many secrets are still hiding in those forests.
      visual_query: Hyalinobatrachium dianae
      on_screen_text: Species still undiscovered
      key_fact: true
    - narration: >-
        Many glass frog species are threatened. They depend on clean streams and intact forests,
        and they suffer from deforestation, water pollution and chytridiomycosis, a disease caused by a fungus
        that has driven the decline of hundreds of amphibian species around the world.
      visual_query: Monteverde cloud forest
      on_screen_text: Amphibians in danger
      key_fact: false
    - narration: >-
        That's why scientists see them as good indicators of an ecosystem's health:
        if glass frogs disappear from a stream, something is going wrong in that forest.
      visual_query: rainforest Costa Rica
      on_screen_text: Forest thermometers
      key_fact: false
    - narration: >-
        Let's recap: an animal that hides in plain sight, that switches off its color by pulling its blood away,
        that avoids clots in a way we still don't fully understand, and whose fathers stand guard over the eggs.
        All of that, in a body smaller than your thumb.
      visual_query: Hyalinobatrachium fleischmanni
      on_screen_text: Smaller than your thumb
      key_fact: false
    - narration: >-
        If the glass frog amazed you, subscribe to BioNiche: every week we bring you a secret of nature that almost nobody knows.
        And tell me in the comments: if you could have one animal's superpower, which one would you pick?
      visual_query: Centrolenidae
      on_screen_text: Which superpower would you pick?
      key_fact: false
  sources:
    - title: "Taboada C., Delia J. et al. (2022). Glassfrogs conceal blood in their liver to maintain transparency. Science 378(6626):1315-1320"
      reference: "https://doi.org/10.1126/science.abl6620"
    - title: "Barnett J.B. et al. (2020). Imperfect transparency and camouflage in glass frogs. PNAS 117(23):12885-12890"
      reference: "https://doi.org/10.1073/pnas.1919417117"
    - title: "Delia J., Bravo-Valencia L., Warkentin K.M. (2017). Patterns of parental care in Neotropical glassfrogs: fieldwork alters hypotheses of sex-role evolution. Journal of Evolutionary Biology 30(5):898-914"
      reference: "https://scholar.google.com/scholar?q=Patterns+of+parental+care+in+Neotropical+glassfrogs"
    - title: "AmphibiaWeb: Hyalinobatrachium fleischmanni"
      reference: "https://amphibiaweb.org/cgi/amphib_query?where-genus=Hyalinobatrachium&where-species=fleischmanni"
documentary_metadata:
  title: "Glass Frog: It Hides Its Blood to Become Invisible"
  description: >-
    While it sleeps, this frog pulls almost 90% of its red blood cells into its liver and becomes nearly invisible… with no blood clots.
    Here's the discovery published in Science.

    Meet Fleischmann's glass frog (Hyalinobatrachium fleischmanni): why being see-through works as camouflage,
    how scientists measured its blood with lasers and ultrasound, why doctors are interested, and who guards its eggs.
  tags: [glass frog, Hyalinobatrachium fleischmanni, Centrolenidae, amphibians, transparent animals, camouflage, frogs, biology, animal documentary, animal facts, nature, science]
  hashtags: ["#glassfrog", "#amphibians", "#biology"]
  thumbnail_text: IT TURNS INVISIBLE
shorts:
  - hook: This frog has a trick that would send you straight to the hospital.
    fact: >-
      Look. It's a glass frog, and its belly is completely see-through. You can literally watch its heart beat.
      Pretty cool… except that heart pumps red blood, and red stands out like a stop sign.
      So when it falls asleep, it pulls almost ninety percent of its red blood cells out of circulation… and hides them in its liver.
      Without that red, its outline fades away. On a leaf, it basically disappears. And the craziest part? Not a single blood clot.
    cta: Follow BioNiche for more secrets like this.
    visual_queries: [Hyalinobatrachium fleischmanni, Hyalinobatrachium, Centrolenidae, Cochranella, Espadarana prosoblepon, Sachatamia albomaculata]
    on_screen_texts: [The invisible frog]
    beats:
      - {text: "This frog has a trick that would send you straight to the hospital.", visual: glass frog face}
      - {text: "Look. It's a glass frog, and its belly is completely see-through.", visual: glass frog ventral view}
      - {text: "You can literally watch its heart beat.", visual: glass frog heart visible}
      - {text: "Pretty cool… except that heart pumps red blood,", visual: red blood cells microscope}
      - {text: "and red stands out like a stop sign.", visual: glass frog red blood vessel visible}
      - {text: "So when it falls asleep,", visual: glass frog sleeping on leaf}
      - {text: "it pulls almost ninety percent of its red blood cells out of circulation…", visual: blood flowing in capillaries, sticker: "90%"}
      - {text: "and hides them in its liver.", visual: glass frog organs}
      - {text: "Without that red, its outline fades away. On a leaf, it basically disappears.", visual: glass frog silhouette through leaf, sticker: "INVISIBLE"}
      - {text: "And the craziest part? Not a single blood clot.", visual: red blood cells microscope, sticker: "0 CLOTS"}
      - {text: "Follow BioNiche for more secrets like this.", visual: glass frog on leaf}
  - hook: "Can you see this animal's heart? Because I can."
    fact: >-
      This is a glass frog. It lives in Central America, and it's smaller than your thumb. From above, it looks like a normal green frog. But flip it over, and you can see right through it. In females, you can even see the eggs. So why is it see-through? Scientists figured it out in 2020. Its skin is so clear that the edges of its body take on the color of the leaf. That makes its outline almost disappear. And a bird can't catch a frog it can't see.
    cta: "Follow BioNiche for more animals like this."
    visual_queries: [Hyalinobatrachium, Hyalinobatrachium fleischmanni, Centrolenidae]
    on_screen_texts: [You can see its heart]
    beats:
      - {text: "Can you see this animal's heart? Because I can.", visual: glass frog ventral heart}
      - {text: "This is a glass frog. It lives in Central America, and it's smaller than your thumb.", visual: glass frog on fingertip}
      - {text: "From above, it looks like a normal green frog.", visual: glass frog top view}
      - {text: "But flip it over, and you can see right through it.", visual: glass frog ventral organs}
      - {text: "In females, you can even see the eggs.", visual: glass frog female eggs visible}
      - {text: "So why is it see-through? Scientists figured it out in 2020.", visual: glass frog on leaf}
      - {text: "Its skin is so clear that the edges of its body take on the color of the leaf.", visual: glass frog translucent edges on leaf}
      - {text: "That makes its outline almost disappear.", visual: glass frog camouflaged on leaf}
      - {text: "And a bird can't catch a frog it can't see.", visual: Momotus motmot bird}
      - {text: "Follow BioNiche for more animals like this.", visual: glass frog on leaf}
  - hook: "If you did this with your blood, you'd end up in the hospital."
    fact: >-
      When a glass frog falls asleep, it moves almost all of its red blood into its liver. And it keeps it packed in there for hours. In humans, blood packed that tight would form clots. And clots can cause strokes and heart attacks. But when the frog wakes up, its blood starts flowing normally again. And it's completely fine. Nobody knows exactly how it does this. That's why scientists are studying it. It could help create new blood thinners.
    cta: "Follow BioNiche so you don't miss the next one."
    visual_queries: [Hyalinobatrachium fleischmanni, Hyalinobatrachium, Centrolenidae]
    on_screen_texts: [Hidden blood, zero clots]
    beats:
      - {text: "If you did this with your blood, you'd end up in the hospital.", visual: hospital emergency sign}
      - {text: "When a glass frog falls asleep, it moves almost all of its red blood into its liver.", visual: glass frog sleeping on leaf}
      - {text: "And it keeps it packed in there for hours.", visual: glass frog resting on leaf}
      - {text: "In humans, blood packed that tight would form clots.", visual: blood clot microscope}
      - {text: "And clots can cause strokes and heart attacks.", visual: emergency room}
      - {text: "But when the frog wakes up, its blood starts flowing normally again.", visual: blood flowing in capillaries}
      - {text: "And it's completely fine.", visual: glass frog awake}
      - {text: "Nobody knows exactly how it does this.", visual: glass frog close-up}
      - {text: "That's why scientists are studying it. It could help create new blood thinners.", visual: scientists laboratory}
      - {text: "Follow BioNiche so you don't miss the next one.", visual: glass frog on leaf}
  - hook: "In this species it's dad who babysits."
    fact: >-
      Male glass frogs spend days guarding their eggs on a leaf hanging right over a stream. They protect them from insects that want to eat them and even keep them hydrated with their own bodies. That's a bodyguard about an inch long. And once the tadpoles are ready guess what they do? They slide off the leaf and drop straight into the water. And that's how their life begins.
    cta: "Follow BioNiche for more stories like this."
    visual_queries: [Hyalinobatrachium valerioi, Hyalinobatrachium fleischmanni, Centrolenidae]
    on_screen_texts: [Bodyguard dad]
    beats:
      - {text: "In this species it's dad who babysits.", visual: glass frog male with eggs}
      - {text: "Male glass frogs spend days guarding their eggs", visual: glass frog guarding eggs}
      - {text: "on a leaf hanging right over a stream.", visual: leaf with frog and eggs over stream}
      - {text: "They protect them from insects that want to eat them", visual: glass frog on eggs}
      - {text: "and even keep them hydrated with their own bodies.", visual: glass frog pressed against eggs}
      - {text: "That's a bodyguard about an inch long.", visual: glass frog on finger}
      - {text: "And once the tadpoles are ready guess what they do?", visual: glass frog eggs close-up}
      - {text: "They slide off the leaf and drop straight into the water.", visual: tadpoles dripping from leaf}
      - {text: "And that's how their life begins.", visual: rainforest stream}
      - {text: "Follow BioNiche for more stories like this.", visual: glass frog on leaf}
