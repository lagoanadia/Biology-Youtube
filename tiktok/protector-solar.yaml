shorts:
- hook: Si te echas el protector solar así, no te está protegiendo.
  fact: 'Error número uno: poner muy poco. Para la cara y el cuello necesitas unos dos dedos de crema. Error número dos: echártelo solo por la mañana. Si estás al sol, hay que volver a ponerlo cada dos
    horas. Y siempre después de bañarte o de sudar. Error número tres: no usarlo cuando está nublado. Las nubes no bloquean toda la radiación ultravioleta. Y no te olvides del cuello y las orejas.'
  cta: ¿Cuál de estos cometías tú? Dímelo en comentarios.
