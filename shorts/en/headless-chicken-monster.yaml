shorts:
- hook: Scientists call this the headless chicken monster.
  fact: It's actually a sea cucumber. It lives on the floor of the deep ocean. Most of the time, it sits on the mud and eats
    it. Little tentacles shovel the mud into its mouth. But when it wants to go somewhere fast, it does something strange.
    It lifts off the seafloor and swims. It flaps a frilly veil like a cape. It also swims away to escape predators. Some
    swimming sea cucumbers are so see-through you can watch the mud in their gut.
  cta: Follow BioNiche for more weird animals.
