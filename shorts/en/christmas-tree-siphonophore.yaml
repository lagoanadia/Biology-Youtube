  - title: 'Monterey Bay Aquarium, Christmas tree siphonophore (Forskalia sp.) — up to 3 m long; branching tentacles look like
      a holiday tree but are loaded with stinging cells that stun prey; drifts and twirls through the midwater using a
      system of floats and swimming bells; eats small crustaceans and fish, mantis shrimp larvae, bristle worms; surface
      to 2,000 m in the North Pacific and Atlantic'
    reference: https://www.montereybayaquarium.org/animals-the-ocean/animals-a-to-z/christmas-tree-siphonophore
  - title: 'MBARI 2021 Annual Report, MBARI reveals a dazzling diversity of delicate drifters — siphonophores capture prey with
      a curtain of stinging cells; their delicate bodies can break apart at the slightest touch, so they are studied with
      ROVs (robot submarines)'
    reference: https://annualreport.mbari.org/2021/story/mbari-reveals-a-dazzling-diversity-of-delicate-drifters
  - title: 'Physonect siphonophore anatomy (Dunn, Pugh & Haddock 2005; taxonomic keys) — gas-filled float (pneumatophore) at
      the top, swimming bells (nectophores) below; Forskalia has very numerous crowded nectophores and stalked feeding
      polyps (gastrozooids)'
    reference: https://www.brown.edu/Faculty/Dunn_Lab/assets/Dunn-etal2005_Marrus.pdf
