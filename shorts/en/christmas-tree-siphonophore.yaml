shorts:
- hook: This Christmas tree swims, stings, and falls apart if you touch it.
  fact: It's a Christmas tree siphonophore. It can be up to three meters long. At the top is a tiny gas float. Below it,
    many swimming bells pump water. So it drifts and twirls through the dark. Its branches look like decorations. But
    they're loaded with stinging cells. Small shrimp and fish that touch them get stunned. Then its feeding parts swallow
    them. But it's so delicate, it breaks apart at the slightest touch. That's why scientists study it with robot
    submarines. A beautiful tree you should never touch.
