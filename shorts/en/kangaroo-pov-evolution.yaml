shorts:
- hook: You're a tiny kangaroo ancestor, and your forest is disappearing.
  fact: You climb and hop through the rainforest. But Australia slowly dries out. Your trees turn into open grassland. Your
    descendants become expert hoppers. Springy tendons store energy, so speed costs almost nothing. Everywhere else,
    hoppers stay tiny. Your babies are born jellybean-sized. They crawl alone into your pouch to grow. You can even pause
    the next baby until the pouch is free.
  cta: That's how a tiny forest hopper became the kangaroo.
