  sources:
  - title: 'Flinders University VAMP, Macropodidae (kangaroos & wallabies) — ancestors were small, vaguely possum-like
      herbivores/omnivores that hopped and bounded through the rainforests of late Oligocene-early Miocene Australia (28-20
      Ma); central and western Australia dried in the mid-late Miocene (15-10 Ma)'
    reference: https://sites.flinders.edu.au/vamp/fossils/vertebrate-fossils/marsupials/macropodidae-family-kangaroos-wallabies/
  - title: 'Couzens & Prideaux (2018) Science 362:72 — kangaroo diversification tracked grassland expansion (Pliocene); it is
      still debated exactly why hopping started, so the script does not claim a cause'
    reference: https://m.phys.org/news/2018-10-kangaroo-evolution.html
  - title: 'Dawson & Taylor (1973) Energetic cost of locomotion in kangaroos, Nature — red kangaroos hopping 9-22 km/h did not
      increase oxygen use; energy stored in hindlimb tendons; supported by eLife 2024 (posture raises tendon energy storage)'
    reference: https://elifesciences.org/articles/96437
  - title: 'Scientific Reports (2025) / hopping-mammal literature — other hopping mammals range from ~4 g (pygmy jerboa) to
      ~3.5 kg (springhare); male red kangaroos reach ~90 kg'
    reference: https://link.springer.com/10.1038/s41598-025-29939-7
  - title: 'Australian Museum, Red Kangaroo — newborn is the size of a jellybean and climbs into the pouch immediately;
      females can delay the next birth until the previous joey has left the pouch (embryonic diapause)'
    reference: https://australianmuseum.net.au/red-kangaroo
