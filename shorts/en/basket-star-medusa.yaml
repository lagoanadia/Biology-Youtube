shorts:
- hook: This animal is named after a monster with snakes for hair.
  fact: It's a basket star. Its scientific name means Gorgon's head, like Medusa. Its five arms split again and again into
    tiny branches. To eat, it opens them into the current. They form a bowl-shaped net. Tiny animals drift into it. The
    branches are covered in microscopic hooks. They grab the prey like a cat's claws. Then the tips curl around it in a
    knot. And the arm rolls the food to its mouth. It can be more than half a meter wide. No wonder it's named after
    Medusa.
  cta: Follow BioNiche for more weird animals.
