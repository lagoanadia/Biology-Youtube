    reference: https://www.montereybayaquarium.org/animals-the-ocean/animals-a-to-z/basket-star
  - title: 'Gorgonocephalus (Wikipedia, G. arcticus) — name from Greek "Gorgon''s head" (Medusa, snakes for hair), genus
      described by Leach 1815; dichotomously branching arms form a parabolic basket in the current; microscopic hooks on
      the branches pin prey; branchlets curl around prey forming a knot; arms roll the prey to the mouth'
