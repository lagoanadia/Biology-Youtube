  - title: 'Monterey Bay Aquarium, Basket star (Gorgonocephalus eucnemis) — brittle star relative; 10-1,900 m; at least 60 cm
      total diameter; extends long arms and uncurls its branches to form a net that catches tiny drifting animals (small
