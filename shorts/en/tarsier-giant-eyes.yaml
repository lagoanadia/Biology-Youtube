shorts:
- hook: Each of this animal's eyes is about as big as its brain.
  fact: But it can't move its eyes at all. So it turns its head halfway around instead. It lives in the forests of the Philippines.
    And it only comes out at night. Those giant eyes spot insects in the dark. Then it leaps from branch to branch to grab
    them. It even calls out in screams we can't hear.
  cta: And with those eyes it's already watching you.
