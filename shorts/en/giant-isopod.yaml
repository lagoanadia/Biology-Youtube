shorts:
- hook: On the deep seafloor, something just found a fish head.
  fact: It's a giant isopod. A relative of the tiny pill bugs in your garden. But this one can grow up to a foot and a half
    long. It's a scavenger. It feeds on dead animals that sink to the bottom. But this one didn't stay to eat. It grabbed
    the fish head and swam away with it. Look closely. It's swimming upside down. We've known about giant isopods for over
    a century. Yet we still know very little about how they live.
  cta: Follow BioNiche for more weird animals.
