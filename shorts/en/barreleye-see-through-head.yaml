shorts:
- hook: Those two dots aren't its eyes.
  fact: They're its nostrils. Its real eyes are the green domes inside its see-through head. Its head is covered by a clear
    shield full of fluid. It hangs almost still, six hundred meters down. Its eyes point up to spot the shadows of prey above.
    Then they rotate forward so it can see what it eats.
  cta: So next time it stares at you, look higher.
