- title: 'How Comb Jellies Make Rainbows 🌈 #shorts #combjelly #ocean'
  description: 'Comb jellies shimmer like a rainbow, but those colors are not their own light. They swim by beating eight
    rows of tiny hair plates, and light bouncing off the moving plates splits into every color. In 2024, scientists also
    watched two injured comb jellies fuse into a single animal. Animation: BioNiche. Follow BioNiche for more weird
    animals.'
