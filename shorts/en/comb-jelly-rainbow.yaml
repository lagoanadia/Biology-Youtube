  - title: 'Jokura, Anttonen, Rodriguez-Santiago & Arenas (2024) Rapid physiological integration of fused ctenophores.
      Current Biology 34(19):R889-R890 — two injured Mnemiopsis leidyi fused into a single entity (9 of 10 pairs); within
      ~2 h about 90-95 % of muscle contractions were synchronized; shared digestive tract'
    reference: https://doi.org/10.1016/j.cub.2024.07.084
  - title: 'Press coverage of Jokura et al. 2024 (two-hour synchronization figure)'
