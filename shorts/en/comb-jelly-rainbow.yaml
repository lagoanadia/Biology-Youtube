shorts:
- hook: This animal shimmers like a rainbow. But the rainbow isn't its own light.
  fact: It's a comb jelly. And it's not even a jellyfish. Along its body are eight rows of tiny hairs, called combs. It
    beats them in waves to swim. And when light hits the moving combs, it splits into every color. The rainbow is just
    reflected light. In 2024, scientists saw two injured comb jellies fuse into one. Within hours, they moved as one animal.
  cta: Follow BioNiche for more weird animals.
