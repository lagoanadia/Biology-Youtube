  - title: 'NOAA Ocean Exploration daily image, Comb Jelly (2020-10-15) — the rainbow-hued displays are not bioluminescence:
      light is scattered by the moving rows of combs (cilia) the animal uses to propel itself; eight comb rows, each a
      stack of comb plates'
    reference: https://oceanexplorer.noaa.gov/multimedia/daily-image/media/20201015.html
