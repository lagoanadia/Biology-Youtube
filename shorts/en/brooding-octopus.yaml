shorts:
- hook: This octopus mom guarded her eggs for four and a half years.
  fact: In 2007, scientists found her with fresh eggs, deep off California. So they came back to check on her. Eighteen
    times. She was always there, covering her eggs. Crabs and shrimp walked right up to her. But she didn't eat them. She
    pushed them away. The water there is barely above freezing. So the eggs grow very slowly. Month after month, she got
    paler. Then one day, she was gone. Only empty eggs were left. Her babies had hatched. No animal has ever guarded its
    eggs longer.
  cta: Follow BioNiche for more weird animals.
