shorts:
- hook: You're the hedgehog's ancestor, and you're defenseless.
  fact: You eat bugs at night, and you can't outrun anything. But hair is made of keratin, like your nails. Babies with
    stiffer hairs hurt to bite, so they survive more. Over generations, the hairs get thicker and sharper, until they're
    spines. A ring of muscle pulls your skin tight like a drawstring. Now you're a spiky ball. Your cousins, the moonrats,
    kept their fur. Porcupines and echidnas evolved spines on their own.
  cta: And it all started as fur.
