shorts_metadata:
- title: 'POV: You''re the Hedgehog Before It Had Spikes 🦔 #shorts #hedgehog'
  description: 'Hedgehog spines are hair. Their ancestors were small, furry insect-eaters that hunted at night and could
    not outrun predators. Hair is made of keratin, and babies with stiffer hairs were harder to bite, so they survived
    more often. Over many generations those hairs became thick, sharp spines, and a ring of muscle under the skin evolved
    to pull it closed like a drawstring bag, turning the hedgehog into a spiky ball. Their closest living relatives, the
    moonrats, still have fur, and porcupines and echidnas evolved spines completely separately. Animation: BioNiche.
    Follow BioNiche for more weird animals.'
