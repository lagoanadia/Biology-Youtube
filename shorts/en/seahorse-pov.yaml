shorts:
- hook: You're a male seahorse, and you're about to get pregnant.
  fact: Every morning, you and your partner dance together. Then she drops her eggs into your pouch, and you fertilize them.
    Your pouch grows a placenta-like lining that gives them oxygen. Your family even lost immune genes that might reject
    them. A few weeks later, you go into labor. You pump out hundreds of tiny babies. And often, you get pregnant again
    right away.
  cta: Best dad in the ocean.
