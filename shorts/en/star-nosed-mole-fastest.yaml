shorts:
- hook: This mole eats faster than any other mammal.
  fact: It can find and eat small prey in less than a quarter of a second. The secret is on its face. A pink star of twenty-two
    tentacles. They're covered in over twenty-five thousand touch sensors. It taps the ground up to twelve times every second.
    And it even hunts underwater. It blows bubbles onto its prey and sniffs them back in. That's how it smells underwater.
  cta: Then the star finds the next snack.
