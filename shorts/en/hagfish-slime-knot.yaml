shorts:
- hook: If a shark bites this fish, it chokes on slime.
  fact: It's a hagfish. It lives on the seafloor, deep in the ocean. Look at the little holes along its side. Each one leads
    to a slime gland. When a predator bites, the hagfish releases slime. In seawater, the slime becomes thick goo that clogs
    the attacker's gills. So the predator lets go. But now the hagfish is covered in its own slime. So it ties its body into
    a knot. It slides the knot along its body and wipes the slime off.
  cta: Follow BioNiche for more weird animals.
