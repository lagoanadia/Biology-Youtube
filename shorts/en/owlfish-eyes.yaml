shorts:
- hook: This fish has eyes almost as big as its head.
  fact: It's called the owlfish. It's a deep-sea fish about the size of your hand. It lives in the North Pacific, far below
    the surface. Down there, almost no sunlight reaches. So its huge eyes catch every bit of light there is. Just like an
    owl hunting at night. Faint glimmers in the dark guide it to food. Tiny shrimp and jellies. Scientists filmed one with
    a robot submarine, about twelve hundred meters down. Its scientific name even starts with false, because it was first
    put in the wrong group.
  cta: Follow BioNiche for more weird animals.
