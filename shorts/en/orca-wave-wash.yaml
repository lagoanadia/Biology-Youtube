- title: 'These Orcas Make Waves to Catch Seals 🌊 #shorts #orca #antarctica'
  description: 'In Antarctica, some orcas hunt seals resting on floating ice. They line up side by side and swim at the
    ice together, pushing a wave over it until the seal slides into the water. Strangely, they almost always pick
    Weddell seals, even though most seals there are a different kind. Animation: BioNiche. Follow BioNiche for more
    weird animals.'
