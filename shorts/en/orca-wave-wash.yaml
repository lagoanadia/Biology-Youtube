shorts:
- hook: These orcas make waves to knock seals off the ice.
  fact: In Antarctica, seals rest on floating ice, where orcas can't reach them. One orca pokes its head up to look.
    It's called spy-hopping. When it spots a seal, they line up side by side. They swim at the ice together. Their bodies
    push a big wave over it. It often takes a few waves. If the ice breaks, the next wave is even easier. But here's the
    weird part. They almost always pick the Weddell seal. Even though most seals there are another kind. Scientists still
    don't know why.
  cta: Follow BioNiche for more weird animals.
