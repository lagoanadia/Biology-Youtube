shorts_metadata:
- title: 'POV: You''re Turning Into an Electric Eel ⚡ #shorts #electriceel'
  description: 'Where does an electric eel''s electricity actually come from? Its tail muscles stopped squeezing and turned
    into living batteries: each cell lets sodium rush in at once and makes a tiny zap, and thousands of them stacked in a
    row add up to as much as 860 volts. It started as weak pulses to feel through the muddy Amazon water, and fish
    evolved electric organs from muscle at least six separate times. Animation: BioNiche. Follow BioNiche for more weird
    animals.'
