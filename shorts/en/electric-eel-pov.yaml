shorts:
- hook: You're a fish in the muddy Amazon, and you can't see a thing.
  fact: So your tail muscles slowly stop squeezing and turn into batteries. Each cell lets sodium rush in at once, making
    a tiny zap. Thousands stacked in a row add up. First, weak pulses help you feel through the dark. Later, your
    descendants crank it up to 860 volts, enough to make hiding prey twitch and give itself away.
  cta: That's how a lost fish became the electric eel.
