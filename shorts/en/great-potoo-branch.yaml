shorts:
- hook: That broken branch is actually a bird.
  fact: All day it sits perfectly still, high up in a tree. When danger comes, it points its beak to the sky. Now it looks
    exactly like a broken branch. Its eyes are closed, but it's still watching. Tiny slits in its eyelids let it sense movement.
    Then night falls and the branch wakes up. It flies out and opens a huge mouth. Big flying insects disappear inside.
  cta: By sunrise it's a broken branch again.
