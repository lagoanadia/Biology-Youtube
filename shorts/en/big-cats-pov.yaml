shorts:
- hook: You're the ancestor of all big cats, and your family is about to split.
  fact: Asia, millions of years ago. Some kids stay in Asia's forests and get stripes, tigers. Others reach Africa and haul
    prey up trees, leopards. Some cross into the Americas and become jaguars, with bites that crack turtle shells. But
    the puma? Not your family at all. One of its closest cousins is the cheetah. It can't even roar. It purrs.
  cta: And it all started in Asia.
