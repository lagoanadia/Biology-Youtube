shorts_metadata:
- title: 'POV: You''re the Ancestor of All Big Cats 🐯 #shorts #tiger #jaguar'
  description: 'Tiger, leopard, jaguar and puma: why are they different? Big cats started in Asia millions of years ago.
    Some stayed in Asia''s forests and became tigers, others reached Africa and became leopards that haul prey up trees,
    and some crossed into the Americas and became jaguars, with bites strong enough to crack turtle shells. The puma is
    not even in the family: one of its closest cousins is the cheetah, and it can''t roar, it purrs. Animation:
    BioNiche. Follow BioNiche for more weird animals.'
