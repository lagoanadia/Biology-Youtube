- title: 'This Creature Is Longer Than a Blue Whale 🌀 #shorts #siphonophore #deepsea'
  description: 'In 2020 a robot exploring deep canyons off Western Australia filmed a giant siphonophore coiled into a spiral.
    Its outer ring alone was estimated at 47 meters, longer than a blue whale. Scientists think the spiral is a hunting trap
    that works like a drift net, catching tiny animals that drift into it. It doesn''t chase its food. It just waits. Animation:
    BioNiche. Follow BioNiche for more weird animals.'
