shorts:
- hook: Scientists filmed a creature longer than a blue whale.
  fact: And it was coiled into a giant spiral. A robot found it in deep canyons off Western Australia in 2020. Its outer ring
    alone was estimated at forty-seven meters. Scientists think that spiral is a hunting trap. It works like a drift net that
    sweeps up food. Tiny animals that drift into it get caught. It doesn't even need to chase its food.
  cta: It just hangs in the dark and waits.
