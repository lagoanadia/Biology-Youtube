shorts:
- hook: This baby dragon has no father.
  fact: In 2006, a female at a British zoo laid eggs. But no male had been near her. Then the eggs hatched. DNA showed the
    babies came only from their mother. Half her chromosomes doubled up to make each one. And every single baby was a boy.
    Scientists think this helps a female stranded alone on an island. She can still start a family.
  cta: That's how a baby dragon ends up with no father.
