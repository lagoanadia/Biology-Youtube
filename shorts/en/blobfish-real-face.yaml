shorts:
- hook: This is not what a blobfish really looks like.
  fact: That droopy face is actually an injury. Blobfish live up to twelve hundred meters down. There the crushing pressure
    holds their soft bodies in shape. Their jelly-like flesh is lighter than water. So they float above the seafloor without
    wasting energy. Pull one up too fast and the body collapses. Down in the deep it looks like a normal fish.
  cta: So next time someone shows you the blob, tell them.
