shorts:
- hook: This fish finds a partner and never lets go.
  fact: It's a deep-sea anglerfish. This is the female, with a glowing lure. In the dark, they rarely meet. The male is
    tiny. She can be sixty times longer. He has huge nostrils to follow her scent. When he finds her, he bites on. And he
    never lets go. Their bodies fuse, and they share the same blood. He gets all his food from her. Normally, a body
    attacks tissue that isn't its own. But these anglerfish lost parts of their immune system. Scientists think that's
    what lets them fuse.
  cta: Follow BioNiche for more weird animals.
