shorts_metadata:
- title: 'POV: You''re a Lizard That Shoots Blood From Its Eyes 🩸 #shorts #lizard'
  description: 'The Texas horned lizard has a last-resort defence: when a coyote grabs it, it squeezes the veins in its head
    until pressure builds behind its eyes and blood shoots out, sometimes more than a meter. To dogs and coyotes the blood
    tastes awful: they drop the lizard, shake their heads and drool. Birds are not bothered, so the trick is mostly for
    canines. Animation: BioNiche. Follow BioNiche for more weird animals.'
