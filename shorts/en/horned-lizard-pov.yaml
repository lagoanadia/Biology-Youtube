shorts:
- hook: You're a horned lizard, and a coyote just grabbed you.
  fact: Your camouflage didn't work. Puffing up didn't work either. So you squeeze the veins in your head. Pressure builds
    behind your eyes, and you shoot blood out of them. It can fly more than a meter. And to dogs and coyotes, it tastes
    awful. They drop you, shake their heads and drool. Birds don't care, so you save it for dogs.
  cta: Worth it.
