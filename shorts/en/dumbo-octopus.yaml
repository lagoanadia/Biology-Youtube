shorts:
- hook: In the deep sea, something is flapping its ears.
  fact: It's a dumbo octopus. And those ears are actually fins. Most octopuses get around by shooting out jets of water. But
    the dumbo barely does that. Instead, it flaps its fins and glides through the water. That's how it got its name. Just
    like Disney's flying elephant. Its arms are webbed, so it can open them like an umbrella. And it glides deeper than any
    octopus we know. One was filmed almost seven kilometers down. The deepest octopus ever seen.
  cta: Follow BioNiche for more weird animals.
