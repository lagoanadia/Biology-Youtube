shorts:
- hook: This octopus swims by flapping its ears.
  fact: Meet the dumbo octopus. It's named after Disney's flying elephant. But those ears are actually fins. Most octopuses
    shoot out water to jet around. Dumbo octopuses mostly use their fins instead. Their arms are joined by a web of skin.
    So they can open up like an umbrella. They also live deeper than any other known octopus. One was filmed almost seven
    kilometers down. Down there, it's completely dark.
  cta: Follow BioNiche for more weird animals.
