shorts:
- hook: Once a week this sloth risks its life just to poop.
  fact: It climbs all the way down from the treetops. On the ground it's an easy target. Scientists think the reason is tiny
    moths in its fur. The moths lay their eggs in sloth poop. New moths fly up and move into the fur. They help green algae
    grow on the sloth. And the sloth eats that algae as a snack.
  cta: So next week it climbs down again.
