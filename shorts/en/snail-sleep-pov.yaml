shorts_metadata:
- title: 'POV: You''re a Snail Glued to a Card for 4 Years 🐌 #shorts #snail'
  description: 'In 1846 the British Museum glued a desert snail to a card, thinking it was dead. It was just sealed in its
    shell, waiting for rain. Four years later someone dropped it in warm water and it crawled out alive. And pond snails
    sleep even weirder: about seven short naps packed into thirteen hours, then almost two days wide awake, no matter if
    it is day or night. Animation: BioNiche. Follow BioNiche for more weird animals.'
