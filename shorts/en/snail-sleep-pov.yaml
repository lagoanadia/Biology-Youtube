shorts:
- hook: You're a snail, and you've just been glued to a museum card.
  fact: London, 1846. Everyone thinks you're dead. But you're just sealed in your shell, waiting for rain. Four years pass.
    Then someone drops you in warm water, and you crawl out. Your pond-snail cousins sleep even weirder. Seven quick naps
    in thirteen hours, then almost two days wide awake. Day or night doesn't matter.
  cta: So never trust a snail that looks dead.
