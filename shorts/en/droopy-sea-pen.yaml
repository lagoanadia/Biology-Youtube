shorts:
- hook: This looks like one flower on a stick. But it's a whole crowd of animals.
  fact: It's a droopy sea pen. It all starts with one tiny polyp. That polyp grows into a long stalk. Then new polyps bud
    at the top, like copies of itself. Some catch food with feathery tentacles. Others pump water through the colony. Its
    swollen base anchors it in the mud. And the stalk can grow taller than two meters. The current pushes the head over,
    and the tentacles grab passing food. So that flower is really a team, working as one.
  cta: Follow BioNiche for more weird animals.
