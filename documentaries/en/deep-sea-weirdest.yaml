  - Siphonophora
  scenes:
  - narration: Most of our planet is covered by ocean. And most of that ocean is dark. A few hundred meters down, the sunlight
      starts to fade. A little deeper, it disappears completely. This dark water is the largest living space on Earth. Yet
      most of it has never been explored. So scientists send robots down to look. And what their cameras find seems to come
      from another planet. A fish that ties itself in a knot. A sea cucumber that swims. An octopus with ears. A giant bug
      that steals dinner. And a living rainbow. These are the weirdest creatures of the deep sea.
    visual_query: '-'
    on_screen_text: The Weirdest Creatures of the Deep Sea
    key_fact: false
  - narration: Our first creature lives on the muddy seafloor. It looks like an eel. But it's a hagfish. Hagfish have no jaws.
      And they've been around for about three hundred million years. That's older than the dinosaurs. But their real superpower
      is hidden along their sides. Look at this row of little holes. Each one leads to a slime gland. When a predator bites,
      the hagfish releases slime. As soon as it touches seawater, it turns into thick goo. Scientists have filmed sharks and
      eels trying to eat hagfish. The slime clogs their gills. So they spit the hagfish out and swim away. But now the hagfish
      has a problem. It's covered in its own slime. So it does something even weirder. It ties its body into a knot. Then
      it slides the knot down its body. And the slime gets wiped away. Problem solved.
    visual_query: '-'
    on_screen_text: Chapter 1|The Slime Fish
    key_fact: false
  - narration: Our next creature also lives on the seafloor. Scientists have a nickname for it. The headless chicken monster.
      It's actually a sea cucumber. Most of the time, it sits on the mud and eats it. Little tentacles shovel the mud into
      its mouth. But when it needs to move fast, it does something surprising. It lifts off the seafloor and swims. It flaps
      a frilly veil, like a cape. That's how it escapes from predators. Some swimming sea cucumbers are so see-through that
      you can watch the mud inside their gut. In 2018, scientists filmed one in the icy waters near Antarctica. And its nickname
      went around the world.
    visual_query: '-'
    on_screen_text: Chapter 2|The Headless Chicken Monster
    key_fact: false
  - narration: Deeper still, something is flapping its ears. It's a dumbo octopus. And those ears are actually fins. Most
      octopuses get around by shooting out jets of water. But the dumbo barely does that. Instead, it flaps its fins and glides
      through the water. That's how it got its name. Just like Disney's flying elephant. Its arms are webbed, so it can open
      them like an umbrella. When it lands, it spreads them out like a skirt. And dumbo octopuses live deeper than any other
      octopus we know. One was filmed almost seven kilometers down. The deepest octopus ever seen.
    visual_query: '-'
    on_screen_text: Chapter 3|The Dumbo Octopus
    key_fact: false
  - narration: On the deep seafloor, something just found a fish head. It's a giant isopod. A relative of the tiny pill bugs
      in your garden. But this one can grow up to a foot and a half long. It's a scavenger. It feeds on dead animals that
      sink to the bottom. And it can go a very long time without eating. In an aquarium in Japan, one refused food for more
      than five years. But this one didn't wait. It grabbed the fish head and swam away with it. Look closely. It's swimming
      upside down. We've known about giant isopods for over a century. Yet we still know very little about how they live.
    visual_query: '-'
    on_screen_text: Chapter 4|The Giant Isopod
    key_fact: false
  - narration: Our next creature floats in the open water. It looks like a jellyfish. But it's not. It's a comb jelly. Comb
      jellies are so different from other animals that they have their own group. Some scientists even think they were the
      first branch of animals to split off. Along their bodies run eight rows of tiny hairs. The hairs beat like little oars
      and push the animal forward. And as they move, they scatter the light into rainbow colors. This one has a bright red
      stomach. Scientists think the red hides the light of the glowing prey it eats. Down here, a glowing belly could attract
      predators. Other comb jellies trail long tentacles to catch food.
    visual_query: '-'
    on_screen_text: Chapter 5|The Rainbow Comb Jelly
    key_fact: false
  - narration: Our last creature looks like a tangled string. But it's not one animal. It's many tiny animals living together
      as one. It's called a siphonophore. Each member has a job. Some swim. Some catch food. Others digest it for the whole
      colony. This one is a dandelion siphonophore. It anchors itself to the seafloor with its tentacles. Other siphonophores
      drift through the open ocean. In 2020, scientists filmed one off the coast of Australia that may have been more than
      forty meters long. That's longer than a blue whale.
    visual_query: '-'
    on_screen_text: Chapter 6|The Colony
    key_fact: false
  - narration: A fish that fights with slime. A sea cucumber that flies. An octopus with ears. A bug that steals its dinner.
      A living rainbow. And an animal made of many animals. Each one found its own strange way to survive in the dark. And
      most of the deep sea is still unexplored. So the weirdest creature of all may still be waiting down there. Subscribe
      to BioNiche for more weird animals.
    visual_query: '-'
    on_screen_text: ''
    key_fact: false
